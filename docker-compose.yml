services:
  postgres:
    image: postgres:16-alpine
    container_name: node_repo_postgres
    environment:
      POSTGRES_PASSWORD: rootpass
    ports:
      - "3001:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d node_repo_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8
    container_name: node_repo_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3002:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  mariadb:
    image: mariadb:11
    container_name: node_repo_mariadb
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
    ports:
      - "3003:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/init/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqlite:
    image: nouchka/sqlite3
    container_name: node_repo_sqlite
    working_dir: /data
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./tests/dependency/sqlite:/data
    healthcheck:
      test: ["CMD", "sqlite3", "--version"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mysql_data:
  mariadb_data: